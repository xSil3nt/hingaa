<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>hingaa · Find your way</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/journey.css"><link rel="stylesheet" href="/new.css"></head>
<body data-theme="new" class="new-app">
<header class="new-header"><button class="new-menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-controls="new-menu" aria-expanded="false"><span></span><span></span><span></span></button><a class="new-wordmark" href="/new" aria-label="hingaa home">HINGAA<span aria-hidden="true">.</span></a><button id="header-locate" class="new-round-button" aria-label="Use current location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg></button></header>
<nav id="new-menu" class="new-menu" aria-label="Main menu" hidden><a href="/new">Plan a journey <span>↗</span></a><a href="/new/journey">Current journey <span>→</span></a><a href="/">Original design <span>↗</span></a></nav>
<main class="new-layout"><section class="planner new-sheet" aria-label="Journey planner"><span class="new-sheet-handle" aria-hidden="true"></span><details class="search-panel new-search" id="new-search" open><summary><span>Where to?</span><span class="new-edit-label">Edit trip <span aria-hidden="true">↗</span></span></summary>
<form id="search-form"><div class="endpoints"><div class="field"><span class="field-dot origin-dot" aria-hidden="true"></span><div class="input-wrap"><label for="origin">From</label><input id="origin" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="origin-options" placeholder="Place or bus stop"><div id="origin-options" class="suggestions" role="listbox" hidden></div></div><button type="button" id="locate" class="icon-button" aria-label="Use current location">◎</button><button type="button" class="icon-button pin" data-field="origin" aria-label="Choose origin on map">⌖</button></div>
<div class="field"><span class="field-dot destination-dot" aria-hidden="true"></span><div class="input-wrap"><label for="destination">To</label><input id="destination" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="destination-options" placeholder="Where to?"><div id="destination-options" class="suggestions" role="listbox" hidden></div></div><button type="button" id="swap" class="icon-button" aria-label="Swap origin and destination">⇅</button><button type="button" class="icon-button pin" data-field="destination" aria-label="Choose destination on map">⌖</button></div></div><div class="search-bottom"><button class="primary" id="search-button">Find journeys <span aria-hidden="true">→</span></button></div></form><p id="message" role="status" aria-live="polite" hidden></p><div id="place-attribution" class="small"></div></details>
<div id="results" aria-live="polite"><div class="new-empty"><p>Use ⌖ to choose a point on the map.</p></div></div></section>
<section class="map-panel" aria-label="Journey map"><div id="map"></div><div class="new-map-caption"><span class="new-map-dot"></span>Greater Malé</div><div id="pin-banner" hidden>Tap a public street to set your destination. <button id="cancel-pin">Cancel</button></div><div class="map-key"><span class="key-bus"></span> Bus <span class="key-walk"></span> Walk</div><button id="fit" class="map-fit" aria-label="Fit journey on map">⌗</button></section></main>
<script src="/vendor/leaflet.js"></script><script type="module" src="/new-shell.js"></script><script type="module" src="/app.js"></script></body></html>
