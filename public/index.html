<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17695a"><title>hingaa · Greater Malé</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="/style.css"></head>
<body>
<header><a href="/" class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span>hingaa<small>Greater Malé</small></span></a></header>
<main>
  <section class="planner" aria-label="Journey planner">
    <div class="search-panel">
      <h1>Where are you going?</h1>
      <form id="search-form">
        <div class="endpoints">
          <div class="field"><span class="field-dot origin-dot" aria-hidden="true"></span><div class="input-wrap"><label for="origin">From</label><input id="origin" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="origin-options" placeholder="Place or bus stop"><div id="origin-options" class="suggestions" role="listbox" hidden></div></div><button type="button" id="locate" class="icon-button" aria-label="Use current location" title="Use current location">◎</button><button type="button" class="icon-button pin" data-field="origin" aria-label="Choose origin on map" title="Choose on map">⌖</button></div>
          <div class="field"><span class="field-dot destination-dot" aria-hidden="true"></span><div class="input-wrap"><label for="destination">To</label><input id="destination" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="destination-options" placeholder="Where to?"><div id="destination-options" class="suggestions" role="listbox" hidden></div></div><button type="button" id="swap" class="icon-button" aria-label="Swap origin and destination" title="Swap places">⇅</button><button type="button" class="icon-button pin" data-field="destination" aria-label="Choose destination on map" title="Choose on map">⌖</button></div>
        </div>
        <div class="search-bottom"><button class="primary" id="search-button">Find journeys <span aria-hidden="true">→</span></button></div>
      </form>
      <p id="message" role="status" aria-live="polite" hidden></p>
      <div id="place-attribution" class="small"></div>
    </div>
    <div id="results" aria-live="polite"></div>
  </section>
  <section class="map-panel" aria-label="Journey map"><div id="map"></div><div id="pin-banner" hidden>Tap a public street to set your destination. <button id="cancel-pin">Cancel</button></div><div class="map-key"><span class="key-bus"></span> Bus <span class="key-walk"></span> Walk <span class="key-live"></span> Vehicle</div><button id="fit" class="map-fit" aria-label="Fit journey on map">⌗</button><div class="map-caption">Greater Malé · RTL bus network</div></section>
</main>
<script src="/vendor/leaflet.js"></script><script type="module" src="/app.js"></script>
</body></html>
