<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>hingaa · Find your way</title><link rel="icon" type="image/svg+xml" href="/icon.svg?v=2"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/journey.css"><link rel="stylesheet" href="/app-theme.css"></head>
<body data-theme="dark" class="new-app">
<header class="new-header"><a class="new-wordmark" href="/" aria-label="hingaa home"><img src="/logo.svg" alt="hingaa" width="158" height="69"></a><button id="header-locate" class="new-round-button" aria-label="Use current location"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M21 3 3 10.2l7.4 3.4L13.8 21 21 3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button></header>
<main class="new-layout"><section class="planner new-sheet" aria-label="Journey planner"><span class="new-sheet-handle" aria-hidden="true"></span><details class="search-panel new-search" id="new-search" open><summary><span id="trip-title">Where to?</span><span class="new-edit-label">Edit trip <span aria-hidden="true">↗</span></span></summary>
<form id="search-form"><div class="endpoints"><div class="field"><span class="field-dot origin-dot" aria-hidden="true"></span><div class="input-wrap"><label for="origin">From</label><input id="origin" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="origin-options" placeholder="Place or bus stop"><div id="origin-options" class="suggestions" role="listbox" hidden></div></div><button type="button" id="locate" class="icon-button" aria-label="Use current location"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M21 3 3 10.2l7.4 3.4L13.8 21 21 3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button><button type="button" class="icon-button pin" data-field="origin" aria-label="Choose origin on map">⌖</button></div>
<div class="field"><span class="field-dot destination-dot" aria-hidden="true"></span><div class="input-wrap"><label for="destination">To</label><input id="destination" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="destination-options" placeholder="Where to?"><div id="destination-options" class="suggestions" role="listbox" hidden></div></div><button type="button" id="swap" class="icon-button" aria-label="Swap origin and destination">⇅</button><button type="button" class="icon-button pin" data-field="destination" aria-label="Choose destination on map">⌖</button></div></div><div class="search-bottom"><button class="primary" id="search-button">Hingaa <span aria-hidden="true">→</span></button></div></form><p id="message" role="status" aria-live="polite" hidden></p><div id="place-attribution" class="small"></div></details>
<div id="results" aria-live="polite"><div class="new-empty"><p>Use ⌖ to choose a point on the map.</p></div></div></section>
<section class="map-panel" aria-label="Journey map"><div id="map"></div><div id="pin-banner" hidden>Tap a location on the map to select it. <button id="cancel-pin">Cancel</button></div><div class="map-key"><span class="key-bus"></span> Bus <span class="key-walk"></span> Walk</div></section></main>
<script src="/vendor/leaflet.js"></script><script type="module" src="/app-shell.js"></script><script type="module" src="/app.js"></script></body></html>
